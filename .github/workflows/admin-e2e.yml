name: Admin regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  admin-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-playwright-failures
          path: test-results/
          retention-days: 3
