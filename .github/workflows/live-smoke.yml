name: Production API smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify deployed Vercel proxy and Render/MongoDB
        env:
          SITE_URL: https://ajshadowmusic.vercel.app
        run: |
          node --input-type=module <<'NODE'
          const origin=process.env.SITE_URL;
          let lastError;
          for(let attempt=1;attempt<=15;attempt++){
            try{
              const response=await fetch(origin+'/backend/api/content',{signal:AbortSignal.timeout(22000),headers:{'Cache-Control':'no-cache'}});
              if(!response.ok)throw new Error('Published API returned HTTP '+response.status);
              const data=await response.json();
              if(!data?.project?.title)throw new Error('Published content does not include a project title');
              const anon=await fetch(origin+'/backend/api/admin',{signal:AbortSignal.timeout(22000),headers:{'Cache-Control':'no-cache'}});
              if(anon.status!==401)throw new Error('Anonymous admin request returned '+anon.status+' instead of 401');
              const invalid=await fetch(origin+'/backend/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password:'deliberately-invalid-smoke-test'}),signal:AbortSignal.timeout(22000)});
              if(invalid.status!==401)throw new Error('Invalid password request returned '+invalid.status+' instead of 401');
              console.log('PASS: Published content, anonymous protection and invalid password rejection.');
              process.exit(0);
            }catch(error){
              lastError=error;
              console.log('Attempt '+attempt+': '+error.message);
              if(attempt<15)await new Promise(r=>setTimeout(r,12000));
            }
          }
          console.error('FAIL: '+lastError?.message);
          const fs=await import('node:fs');
          fs.writeFileSync('api-smoke-reason.txt',String(lastError?.message||'unknown').replace(/https?:\/\/\S+/g,'URL').slice(0,70));
          process.exit(1);
          NODE
      - name: Publish live API check status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then state=success; context="AJ Live API"; else state=failure; reason=$(head -c 65 api-smoke-reason.txt 2>/dev/null | tr -cd '[:alnum:] :_-'); context="AJ Live API: ${reason:-failed}"; fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"Vercel proxy, database content and admin protection\"}"
